<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background:#f5f5f8; color:#222; display:flex; align-items:center; justify-content:center; height:100vh; }
    .card { background:#fff; padding:28px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.06); width:320px; }
    h1{font-size:1.1rem;margin:0 0 12px}
    .err{color:#b33;font-size:.9rem;margin-bottom:10px}
    label{display:block;margin:8px 0 6px}
    input[type=password]{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px}
    button{margin-top:12px;width:100%;padding:10px;border-radius:6px;border:0;background:#333;color:#fff}
    .help{margin-top:10px;font-size:.85rem;color:#666;text-align:center}
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Login</h1>
    <form method="POST" action="/admin-login">
      <div id="err" class="err" style="display:none">Invalid password</div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" />
      <button type="submit">Sign in</button>
    </form>
    <div class="help"><a href="/audience.html">Open audience view</a></div>
  </div>
  <script>
    // show error if ?err=1
    if (location.search.indexOf('err=1') !== -1) document.getElementById('err').style.display = 'block';
  </script>
</body>
</html>
